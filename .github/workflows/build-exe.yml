name: Build Windows exe

on:
  push:
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test desktop/EverythingCombiner.Tests

      - name: Publish single-file exe
        run: dotnet publish desktop/EverythingCombiner.App -c Release -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingCombiner
          path: dist/EverythingCombiner.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EverythingCombiner.exe
