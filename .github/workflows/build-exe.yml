name: Build Windows exe

on:
  push:
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v0.2.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test desktop/EverythingCombiner.Tests

      - name: Publish single-file exe
        run: dotnet publish desktop/EverythingCombiner.App -c Release -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingCombiner
          path: dist/EverythingCombiner.exe

      - name: Create release with the exe
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Everything Combiner ${{ inputs.release_tag || github.ref_name }}
          files: dist/EverythingCombiner.exe
          body: |
            Windows app that combines text files into one .txt and PDFs into one .pdf.

            **Download `EverythingCombiner.exe` below** and double-click it. It is self-contained (64-bit Windows, no .NET install needed).
            Windows SmartScreen may warn because the exe is not code-signed: choose **More info → Run anyway**.
